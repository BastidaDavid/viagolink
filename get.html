<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViaGoLink — Visit the page or get the app</title>
<meta name="description" content="ViaGoLink: book trusted local pros, right on the map. Visit the website or download the app.">
<link rel="icon" type="image/png" href="assets/v-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #111111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;

  .card { width: 100%; max-width: 380px; text-align: center; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%;
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 17px; font-weight: 700;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-dark { background: #111111; color: #ffffff; margin-top: 28px; }
  .btn-light { background: #ffffff; color: #111111; border: 2px solid #111111; }
  .btn small { display: block; font-size: 12px; font-weight: 500; opacity: 0.75; }
  .btn .txt { text-align: left; line-height: 1.2; }
  .foot { margin-top: 30px; font-size: 12px; color: #999; }
</style>
</head>
